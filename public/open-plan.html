<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Opening investment plan</title>
<style>
  :root { color-scheme: light; --bg: #f3f5f8; --surface: #fff; --border: #e1e6ed; --text: #111827; --text-2: #4b5563; --accent: #2a78d6; --accent-ink: #fff; }
  @media (prefers-color-scheme: dark) { :root { color-scheme: dark; --bg: #0e1116; --surface: #161b22; --border: #2a323d; --text: #f3f4f6; --text-2: #c2c8d0; --accent: #3987e5; } }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; background: var(--bg); color: var(--text);
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
  main { width: min(380px, 100%); background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 24px; display: grid; gap: 12px; }
  h1 { font-size: 18px; margin: 0; }
  p { margin: 0; color: var(--text-2); font-size: 14px; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; }
  a.btn, button { flex: 1; text-align: center; padding: 11px 14px; border-radius: 10px; border: 1px solid var(--border); background: var(--surface);
    color: var(--text); font: 600 14px/1.2 inherit; text-decoration: none; cursor: pointer; }
  a.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  a:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  code { word-break: break-all; font-size: 12px; color: var(--text-2); }
</style>
</head>
<body>
<main>
  <h1 id="title">Opening your investment plan…</h1>
  <p id="note">If it doesn't open, use a button below. To keep it in the browser, paste the copied link into Safari's address bar.</p>
  <div class="row">
    <a class="btn primary" id="open" href="#">Open the Ledger</a>
    <button id="copy" type="button">Copy link</button>
  </div>
  <code id="url"></code>
</main>
<script>
  /* A stop between the expense tracker and the Ledger. Moving on by itself
     (not from a tap) is what gives iOS the best chance of keeping the
     Ledger in this browser tab instead of handing it to the Claude app. */
  (function () {
    var raw = decodeURIComponent(location.hash.slice(1) || '');
    // Only ever forward to claude.ai, so this page can't be used to send anyone elsewhere.
    var ok = /^https:\/\/claude\.ai\/[A-Za-z0-9/_\-.]+$/.test(raw);
    var open = document.getElementById('open');
    var copy = document.getElementById('copy');
    document.getElementById('url').textContent = ok ? raw : '';
    if (!ok) {
      document.getElementById('title').textContent = 'No investment plan link';
      document.getElementById('note').textContent = 'Set it in the expense tracker under Settings > Investment plan link.';
      open.hidden = true; copy.hidden = true;
      return;
    }
    open.href = raw;
    copy.addEventListener('click', function () {
      var done = function () { copy.textContent = 'Copied'; };
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(raw).then(done, function () { select(); });
      } else select();
    });
    function select() {
      var r = document.createRange(); r.selectNodeContents(document.getElementById('url'));
      var s = window.getSelection(); s.removeAllRanges(); s.addRange(r);
      copy.textContent = 'Now copy the selected link';
    }
    setTimeout(function () { location.replace(raw); }, 350);
  })();
</script>
</body>
</html>
